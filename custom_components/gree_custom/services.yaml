get_prop_values_all:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: gree_custom

get_prop_values:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: gree_custom
    prop_list:
      required: true
      example:
        - Pow
        - Mod
      selector:
        text:
          multiple: true

test_ifeel_temperature:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: gree_custom
    temperature:
      required: true
      example: 22
      selector:
        number:
          min: 16
          max: 35
          step: 1
          unit_of_measurement: "°C"
          mode: box
